<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Santri · TPA Ar Rahman</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
  const sess = tpa.requireAuth(['admin','wali_kelas']);
  let editingId = null;
  let search = '';

  function render() {
    const d = tpa.loadData();
    const kelasMap = Object.fromEntries(d.kelas.map(k => [k.id, k.kode]));

    // Filter: wali kelas hanya kelasnya sendiri
    let list = d.santri;
    if (sess.role === 'wali_kelas' && sess.kelasId)
      list = list.filter(s => s.kelasId === sess.kelasId);

    if (search) list = list.filter(s =>
      s.nama.toLowerCase().includes(search.toLowerCase()) || s.nis.includes(search));

    const html = `
      <div class="row" style="margin-bottom:12px">
        <input placeholder="🔍 Cari nama atau NIS..." id="search" value="${tpa.esc(search)}" style="flex:1">
        <button class="btn btn-primary" onclick="openForm()">+ Tambah</button>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Data Santri (${list.length})</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Foto</th><th>Nama</th><th>NIS</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody>
              ${list.map(s => `
                <tr>
                  <td><div class="avatar-sm">${s.nama.charAt(0)}</div></td>
                  <td><strong>${tpa.esc(s.nama)}</strong></td>
                  <td>${s.nis}</td>
                  <td><span class="badge green">${kelasMap[s.kelasId] || '-'}</span></td>
                  <td><span class="badge ${s.status==='Aktif'?'green':'red'}">${s.status}</span></td>
                  <td class="row" style="gap:4px">
                    <button class="btn-icon primary" onclick="openForm('${s.id}')">✏️</button>
                    <button class="btn-icon danger" onclick="del('${s.id}')">🗑</button>
                  </td>
                </tr>`).join('') || `<tr><td colspan="6" class="empty">Belum ada data santri</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;

    tpa.mountPage('Data Santri', html);

    document.getElementById('search').addEventListener('input', e => {
      search = e.target.value; render();
    });
  }

  function openForm(id) {
    editingId = id || null;
    const d = tpa.loadData();
    const s = id ? d.santri.find(x => x.id === id) : {};

    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);' +
      'display:grid;place-items:center;z-index:100;padding:16px;overflow-y:auto';
    modal.innerHTML = `
      <div class="card" style="max-width:600px;width:100%;max-height:90vh;overflow-y:auto">
        <div class="card-title"><span>${id?'Edit':'Tambah'} Santri</span>
          <button class="btn-icon" onclick="this.closest('div[style]').remove()">✕</button></div>
        <div class="form-grid">
          <div class="field"><label>NIS</label><input id="f_nis" value="${tpa.esc(s.nis||'')}"></div>
          <div class="field"><label>Nama Lengkap</label><input id="f_nama" value="${tpa.esc(s.nama||'')}"></div>
          <div class="field"><label>Tempat Lahir</label><input id="f_tempat" value="${tpa.esc(s.tempatLahir||'')}"></div>
          <div class="field"><label>Tanggal Lahir</label><input type="date" id="f_tgl" value="${s.tanggalLahir||''}"></div>
          <div class="field"><label>Kelas</label>
            <select id="f_kelas">
              ${d.kelas.map(k => `<option value="${k.id}" ${s.kelasId===k.id?'selected':''}>${k.kode}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Status</label>
            <select id="f_status">
              <option value="Aktif" ${s.status==='Aktif'?'selected':''}>Aktif</option>
              <option value="Nonaktif" ${s.status==='Nonaktif'?'selected':''}>Nonaktif</option>
            </select>
          </div>
          <div class="field full"><label>Nama Ayah</label><input id="f_ayah" value="${tpa.esc(s.namaAyah||'')}"></div>
          <div class="field full"><label>Nama Ibu</label><input id="f_ibu" value="${tpa.esc(s.namaIbu||'')}"></div>
          <div class="field full"><label>No. HP</label><input id="f_hp" value="${tpa.esc(s.noHp||'')}"></div>
          <div class="field full"><label>Alamat</label><textarea id="f_alamat" rows="2">${tpa.esc(s.alamat||'')}</textarea></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="this.closest('div[style]').remove()">Batal</button>
          <button class="btn btn-primary" onclick="save()">Simpan</button>
        </div>
      </div>`;
    document.body.appendChild(modal);

    window.save = () => {
      const data = {
        nis: document.getElementById('f_nis').value.trim(),
        nama: document.getElementById('f_nama').value.trim(),
        tempatLahir: document.getElementById('f_tempat').value.trim(),
        tanggalLahir: document.getElementById('f_tgl').value,
        kelasId: document.getElementById('f_kelas').value,
        status: document.getElementById('f_status').value,
        namaAyah: document.getElementById('f_ayah').value.trim(),
        namaIbu: document.getElementById('f_ibu').value.trim(),
        noHp: document.getElementById('f_hp').value.trim(),
        alamat: document.getElementById('f_alamat').value.trim(),
      };
      if (!data.nama || !data.nis) return tpa.toast('Nama & NIS wajib diisi', 'error');

      tpa.updateData(dd => {
        if (editingId) {
          const i = dd.santri.findIndex(x => x.id === editingId);
          dd.santri[i] = { ...dd.santri[i], ...data };
        } else {
          dd.santri.push({ id: tpa.uid('s'), ...data });
        }
      });
      modal.remove();
      tpa.toast(editingId ? 'Data santri diperbarui' : 'Santri baru ditambahkan', 'success');
      render();
    };
  }

  window.del = (id) => {
    const s = tpa.loadData().santri.find(x => x.id === id);
    if (!confirm(`Nonaktifkan santri "${s.nama}"?`)) return;
    tpa.updateData(d => {
      const i = d.santri.findIndex(x => x.id === id);
      d.santri[i].status = 'Nonaktif';
    });
    tpa.toast('Santri dinonaktifkan', 'success');
    render();
  };

  render();
  tpa.onDataChange(render);
</script>
</body>
</html>
