<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · TPA Ar Rahman</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="login-logo">
      <!-- LOGO BARU -->
      <div class="logo" style="background:#fff; padding:6px; overflow:hidden; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <img src="https://lh3.googleusercontent.com/d/1F6GqnKh5sEGXFMIeFob5a3jib1CbhpHv" alt="Logo TPA" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <!-- END LOGO -->
      <h1>TPA Ar Rahman</h1>
      <p>Jogonalan Lor · Bersama Al-Qur'an</p>
    </div>
    <div class="login-error" id="err"></div>
    <div class="field" style="margin-bottom:12px">
      <label>Username</label>
      <input id="username" placeholder="Masukkan username" autocomplete="username" required>
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>Password</label>
      <input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Masuk →</button>
    <div class="login-hint">
      <strong>Demo akun:</strong><br>
      <code>admin/admin</code> · <code>pengajar1/pengajar</code><br>
      <code>walikelas1/wali</code> · <code>wali1/wali</code>
    </div>
  </form>
</div>
<script src="app.js"></script>
<script>
  // Jika sudah login, langsung ke dashboard
  if (tpa.getSession()) location.href = 'dashboard.html';

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const sess = tpa.login(u, p);
    if (!sess) {
      const err = document.getElementById('err');
      err.textContent = 'Username atau password salah.';
      err.style.display = 'block';
      return;
    }
    location.href = 'dashboard.html';
  });
</script>
</body>
</html>
