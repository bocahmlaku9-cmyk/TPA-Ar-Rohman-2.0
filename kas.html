<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas TPA · TPA Ar Rahman</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
  const sess = tpa.requireAuth(['admin']);

  function render() {
    const d = tpa.loadData();
    const masuk = d.kas.filter(t=>t.jenis==='masuk').reduce((a,t)=>a+t.nominal,0);
    const keluar = d.kas.filter(t=>t.jenis==='keluar').reduce((a,t)=>a+t.nominal,0);
    const saldo = masuk - keluar;
    const list = [...d.kas].sort((a,b) => b.tanggal.localeCompare(a.tanggal));

    const html = `
      <div class="stats" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:14px">
        <div class="stat green"><div class="stat-label">Masuk</div>
          <div class="stat-value" style="font-size:14px">${tpa.fmtRp(masuk)}</div></div>
        <div class="stat orange"><div class="stat-label">Keluar</div>
          <div class="stat-value" style="font-size:14px">${tpa.fmtRp(keluar)}</div></div>
        <div class="stat blue"><div class="stat-label">Saldo</div>
          <div class="stat-value" style="font-size:14px">${tpa.fmtRp(saldo)}</div></div>
      </div>

      <div class="row" style="margin-bottom:12px">
        <span class="spacer"></span>
        <button class="btn btn-primary" onclick="openForm()">+ Transaksi Baru</button>
      </div>

      <div class="card">
        <div class="card-title"><span>Riwayat Transaksi</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th></tr></thead>
            <tbody>
              ${list.map(t => `
                <tr>
                  <td>${tpa.fmtDate(t.tanggal)}</td>
                  <td><span class="badge ${t.jenis==='masuk'?'green':'red'}">${t.jenis==='masuk'?'Masuk':'Keluar'}</span></td>
                  <td>${tpa.esc(t.kategori)}</td>
                  <td>${tpa.esc(t.ket)}</td>
                  <td style="font-weight:700;color:${t.jenis==='masuk'?'var(--success)':'var(--danger)'}">
                    ${t.jenis==='masuk'?'+':'-'}${tpa.fmtRp(t.nominal)}</td>
                </tr>`).join('') || `<tr><td colspan="5" class="empty">Belum ada transaksi</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
    tpa.mountPage('Kas TPA', html);
  }

  function openForm() {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:100;padding:16px';
    modal.innerHTML = `
      <div class="card" style="max-width:500px;width:100%">
        <div class="card-title"><span>Transaksi Baru</span>
          <button class="btn-icon" onclick="this.closest('div[style]').remove()">✕</button></div>
        <div class="form-grid">
          <div class="field"><label>Tanggal</label><input type="date" id="f_tgl" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="field"><label>Jenis</label>
            <select id="f_jenis"><option value="masuk">Masuk</option><option value="keluar">Keluar</option></select></div>
          <div class="field"><label>Kategori</label><input id="f_kat" placeholder="Iuran / Donasi / Operasional"></div>
          <div class="field"><label>Nominal (Rp)</label><input type="number" id="f_nom" min="0" value="0"></div>
          <div class="field full"><label>Keterangan</label><input id="f_ket"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="this.closest('div[style]').remove()">Batal</button>
          <button class="btn btn-primary" onclick="save()">Simpan</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    window.save = () => {
      const data = {
        tanggal: document.getElementById('f_tgl').value,
        jenis: document.getElementById('f_jenis').value,
        kategori: document.getElementById('f_kat').value.trim() || 'Lain-lain',
        nominal: Number(document.getElementById('f_nom').value)||0,
        ket: document.getElementById('f_ket').value.trim(),
        oleh: sess.userId,
      };
      if (data.nominal <= 0) return tpa.toast('Nominal harus > 0', 'error');
      tpa.updateData(d => d.kas.push({ id: tpa.uid('t'), ...data }));
      modal.remove(); tpa.toast('Transaksi disimpan', 'success'); render();
    };
  }

  render();
  tpa.onDataChange(render);
</script>
</body>
</html>
