<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Anggota · TPA Ar Rahman</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root {
    --teal: #0f766e;
    --light-teal: #e6f4f1;
    --dark-green: #0b5e3b;
    --gold: #eab308;
    --dark-text: #1a202c;
    --grey-text: #64748b;
  }

  .kartu-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10mm;
    margin-top: 20px;
    justify-content: flex-start;
  }

  /* KARTU MUTLAK 54mm x 85mm */
  .card-portrait {
    background-color: var(--dark-green);
    border: 1mm solid var(--gold);
    border-radius: 2mm;
    width: 54mm;
    height: 85mm;
    padding: 1.5mm;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 1mm;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden; /* Kunci mati agar tidak meluber */
    position: relative;
  }

  /* --- HEADER --- */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    height: 8mm; /* Tinggi dipaksa fix */
    flex-shrink: 0;
  }
  .card-brand {
    display: flex;
    align-items: center;
    gap: 1mm;
  }
  .card-brand img {
    width: 6mm;
    height: 6mm;
    border-radius: 1mm;
    background: #fff;
    padding: 0.5mm;
    object-fit: contain;
  }
  .brand-text h3 {
    font-size: 7px;
    font-weight: 900;
    margin: 0;
    line-height: 1;
  }
  .brand-text p {
    font-size: 5px;
    font-weight: 700;
    color: #a7f3d0;
    margin: 0;
    line-height: 1;
    margin-top: 1px;
  }
  .header-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1mm;
  }
  .badge-aktif {
    background: var(--gold);
    color: #000;
    font-size: 5px;
    font-weight: 800;
    padding: 0.5mm 1.5mm;
    border-radius: 2mm;
    line-height: 1;
  }
  .header-nis {
    font-size: 5px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  /* --- KOTAK PROFIL (ATAS) --- */
  .profile-box {
    background: #ffffff;
    border-radius: 1.5mm;
    padding: 1.5mm;
    height: 42mm; /* Tinggi fix */
    flex-shrink: 0;
    color: var(--dark-text);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  .profile-top {
    display: flex;
    gap: 1.5mm;
    margin-bottom: 1.5mm;
    height: 13mm;
  }
  .foto-wrap {
    width: 10mm;
    height: 13mm;
    border-radius: 1mm;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    background: #f1f5f9;
  }
  .foto-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .badge-santri {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15,118,110,0.9);
    color: #fff;
    font-size: 4px;
    font-weight: 800;
    text-align: center;
    padding: 0.5mm 0;
  }
  .profile-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .info-nama {
    font-size: 10px;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 1mm;
  }
  .tags {
    display: flex;
    gap: 1mm;
  }
  .tag {
    background: var(--light-teal);
    color: var(--teal);
    font-size: 5px;
    font-weight: 800;
    padding: 0.5mm 1mm;
    border-radius: 0.5mm;
  }

  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1mm;
    flex: 1;
  }
  .detail-item.full { grid-column: 1 / -1; }
  .detail-item .label {
    font-size: 4.5px;
    font-weight: 800;
    color: var(--grey-text);
    text-transform: uppercase;
    line-height: 1;
    display: block;
    margin-bottom: 0.5mm;
  }
  .detail-item .value {
    font-size: 6px;
    font-weight: 800;
    color: var(--dark-text);
    line-height: 1;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .validity-box {
    background: var(--light-teal);
    border: 0.2mm solid #99f6e4;
    border-radius: 0.5mm;
    padding: 1mm;
    display: flex;
    justify-content: space-between;
    margin-top: auto; /* Dorong ke paling bawah kotak profil */
  }
  .validity-box .label { font-size: 5px; font-weight: 800; color: var(--teal); }
  .validity-box .value { font-size: 5px; font-weight: 900; color: var(--teal); }

  /* --- KOTAK QR CODE (BAWAH) --- */
  .qr-box {
    background: #ffffff;
    border-radius: 1.5mm;
    padding: 1.5mm;
    flex: 1; /* Mengisi sisa tinggi (85 - 8 - 42 - gap = ~32mm) */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    color: var(--dark-text);
    box-sizing: border-box;
    min-height: 0; /* WAJIB agar flexbox tidak meluber */
  }

  .qr-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0;
  }
  /* Gambar QR menyesuaikan ruang yang tersisa */
  .qr-container canvas, .qr-container img {
    max-width: 100%;
    max-height: 16mm; 
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .btn-scan {
    background: var(--teal);
    color: #fff;
    font-size: 6px;
    font-weight: 800;
    padding: 1mm 0;
    border-radius: 2mm;
    text-align: center;
    width: 100%;
    margin-top: 1mm;
    flex-shrink: 0;
  }

  .qr-hint {
    font-size: 4.5px;
    color: var(--grey-text);
    text-align: center;
    line-height: 1.1;
    margin: 0.5mm 0 0 0;
    flex-shrink: 0;
  }

  /* --- PRINT SETTINGS --- */
  @media print {
    @page { size: A4; margin: 10mm; }
    body { background: #fff; }
    .sidebar, .topbar, .bottom-nav, .btn-print, .card-title, .muted { display: none !important; }
    .layout, .main, .page { display: block !important; padding: 0 !important; margin: 0 !important; }
    .kartu-grid { gap: 5mm; justify-content: flex-start; }
    .card-portrait { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
  const sess = tpa.requireAuth();

  function render() {
    const d = tpa.loadData();
    let santriList = d.santri.filter(s => s.status === 'Aktif');
    if (sess.role === 'walisantri') santriList = santriList.filter(s => sess.santriIds.includes(s.id));

    const nextYear = new Date();
    nextYear.setFullYear(nextYear.getFullYear() + 1);
    const tglBerlaku = nextYear.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

    const html = `
      <div class="card">
        <div class="card-title">
          <span>Kartu Santri (54mm x 85mm)</span>
          <button class="btn btn-primary btn-print" onclick="window.print()">🖨 Cetak Kartu</button>
        </div>
        
        <div class="kartu-grid">
          ${santriList.map(s => {
            const kelas = d.kelas.find(x => x.id === s.kelasId)?.kode || '-';
            let tglLahirStr = '-';
            if (s.tanggalLahir) {
              const parts = s.tanggalLahir.split('-');
              if (parts.length === 3) tglLahirStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(s.nama)}&background=f1f5f9&color=0f766e&size=128&font-size=0.4`;
            const jk = s.jenisKelamin === 'L' ? 'Laki-laki' : 'Perempuan';

            return `
              <div class="card-portrait">
                <!-- HEADER -->
                <div class="card-header">
                  <div class="card-brand">
                    <img src="https://lh3.googleusercontent.com/d/1F6GqnKh5sEGXFMIeFob5a3jib1CbhpHv" onerror="this.src='https://ui-avatars.com/api/?name=TPA&background=0f766e&color=fff&size=128'">
                    <div class="brand-text">
                      <h3>TPA AR-RAHMAN</h3>
                      <p>KARTU ANGGOTA</p>
                    </div>
                  </div>
                  <div class="header-right">
                    <div class="badge-aktif">AKTIF</div>
                    <div class="header-nis">${s.nis || '-'}</div>
                  </div>
                </div>

                <!-- KOTAK PROFIL -->
                <div class="profile-box">
                  <div class="profile-top">
                    <div class="foto-wrap">
                      <img src="${fallbackImg}" class="foto-img">
                      <div class="badge-santri">SANTRI</div>
                    </div>
                    <div class="profile-info">
                      <div class="info-nama">${tpa.esc(s.nama)}</div>
                      <div class="tags">
                        <span class="tag">${s.nis || '-'}</span>
                        <span class="tag">Kelas ${kelas}</span>
                      </div>
                    </div>
                  </div>

                  <div class="details-grid">
                    <div class="detail-item">
                      <span class="label">TGL LAHIR</span>
                      <span class="value">${tglLahirStr}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">KELAMIN</span>
                      <span class="value">${jk}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">WALI SANTRI</span>
                      <span class="value" title="${s.namaWali || '-'}">${tpa.esc(s.namaWali || '-')}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">GOL DARAH</span>
                      <span class="value">${s.golDarah && s.golDarah !== '-' ? s.golDarah : '-'}</span>
                    </div>
                    <div class="detail-item full">
                      <span class="label">ALAMAT</span>
                      <span class="value" title="${s.alamat || 'Jogonalan Lor'}">${tpa.esc(s.alamat || 'Jogonalan Lor')}</span>
                    </div>
                  </div>

                  <div class="validity-box">
                    <div class="label">📅 MASA BERLAKU</div>
                    <div class="value">${tglBerlaku}</div>
                  </div>
                </div>

                <!-- KOTAK QR -->
                <div class="qr-box">
                  <div class="qr-container">
                    <div id="qr-${s.id}"></div>
                  </div>
                  <div class="btn-scan">◉ SCAN PRESENSI</div>
                  <p class="qr-hint">Arahkan kamera ke QR Code</p>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    tpa.mountPage('Kartu Anggota', html);

    requestAnimationFrame(() => {
      santriList.forEach(s => {
        const qrEl = document.getElementById(`qr-${s.id}`);
        if (qrEl && qrEl.childElementCount === 0) {
          new QRCode(qrEl, {
            text: s.nis || 'TIDAK-ADA-NIS',
            width: 200, // Resolusi tinggi agar tidak pecah
            height: 200, 
            colorDark: '#0f766e', 
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H 
          });
        }
      });
    });
  }

  render();
  tpa.onDataChange(render);
</script>
</body>
</html>
