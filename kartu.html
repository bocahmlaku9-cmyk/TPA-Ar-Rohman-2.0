<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Anggota · TPA Ar Rahman</title>
<link rel="stylesheet" href="shared.css">
<!-- Library QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  /* =========================================
     STYLE KARTU ANGGOTA (TEMA PUTIH TOSCA)
     ========================================= */
  
  .kartu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 16px;
  }

  .card-portrait {
    background-color: #ffffff;
    border: 2px solid #0f766e; /* Border Tosca */
    border-radius: 16px;
    width: 100%;
    max-width: 340px;
    min-height: 580px;
    padding: 16px;
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    position: relative;
    overflow: hidden;
  }

  /* --- HEADER --- */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 12px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .card-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-brand img {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    object-fit: contain;
  }
  .brand-text h3 {
    font-size: 13px;
    font-weight: 800;
    color: #0f766e;
    letter-spacing: 0.5px;
    margin: 0 0 2px 0;
  }
  .brand-text p {
    font-size: 11px;
    font-weight: 700;
    color: #0f766e;
    margin: 0;
  }
  
  .header-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .badge-aktif {
    background: #ccfbf1;
    color: #0f766e;
    font-size: 9px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid #99f6e4;
    text-transform: uppercase;
  }
  .header-nis {
    font-size: 10px;
    font-weight: 700;
    color: #0f766e;
  }

  /* --- KOTAK PROFIL (ATAS) --- */
  .profile-box {
    border: 1.5px solid #0f766e;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }

  .profile-top {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }

  .foto-wrap {
    width: 75px;
    height: 95px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    background: #f1f5f9;
  }
  .foto-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .badge-santri {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(15,118,110,0.9), transparent);
    color: #fff;
    font-size: 8px;
    font-weight: 800;
    text-align: center;
    padding: 10px 0 4px 0;
    text-transform: uppercase;
  }

  .profile-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .info-nama {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
    color: #0f172a;
  }
  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    background: #ccfbf1;
    color: #0f766e;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }

  /* Grid Data Diri */
  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
  }
  .detail-item {
    display: flex;
    flex-direction: column;
  }
  .detail-item.full {
    grid-column: 1 / -1;
  }
  .detail-item .label {
    font-size: 8px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .detail-item .value {
    font-size: 11px;
    font-weight: 700;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Kotak Masa Berlaku */
  .validity-box {
    background: #f0fdfa;
    border: 1px solid #ccfbf1;
    border-radius: 6px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .validity-box .label {
    font-size: 9px;
    font-weight: 700;
    color: #0f766e;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .validity-box .value {
    font-size: 10px;
    font-weight: 800;
    color: #0f766e;
  }

  /* --- KOTAK QR CODE (BAWAH) --- */
  .qr-box {
    border: 1.5px solid #0f766e;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1; /* Mengisi sisa ruang di bawah */
    justify-content: space-between;
  }

  .qr-container {
    background: #fff;
    padding: 4px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .qr-container canvas, .qr-container img {
    width: 150px !important;
    height: 150px !important;
    display: block;
  }

  .btn-scan {
    background: #0f766e;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: 20px;
    text-align: center;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .qr-hint {
    font-size: 9px;
    color: #64748b;
    text-align: center;
    line-height: 1.3;
    margin: 0;
    padding: 0 10px;
  }

  /* --- PRINT SETTINGS --- */
  @media print {
    body { background: #fff; }
    .sidebar, .topbar, .bottom-nav, .btn-print, .card-title span { display: none !important; }
    .layout, .main, .page { display: block !important; padding: 0 !important; margin: 0 !important; }
    .kartu-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .card-portrait { 
      break-inside: avoid; 
      box-shadow: none; 
      -webkit-print-color-adjust: exact; 
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
  const sess = tpa.requireAuth();

  function render() {
    const d = tpa.loadData();
    let santriList = d.santri.filter(s => s.status === 'Aktif');
    
    if (sess.role === 'walisantri') {
      santriList = santriList.filter(s => sess.santriIds.includes(s.id));
    }

    const nextYear = new Date();
    nextYear.setFullYear(nextYear.getFullYear() + 1);
    // Format tanggal masa berlaku: DD MMM YYYY
    const tglBerlaku = nextYear.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

    const html = `
      <div class="card">
        <div class="card-title">
          <span>Kartu Santri</span>
          <button class="btn btn-primary btn-print" onclick="window.print()">🖨 Cetak Kartu</button>
        </div>
        <p class="muted">Pastikan opsi "Background graphics" dicentang saat mencetak.</p>
        
        <div class="kartu-grid">
          ${santriList.map(s => {
            const kelas = d.kelas.find(x => x.id === s.kelasId)?.kode || '-';
            
            // Format Tgl Lahir: DD/MM/YYYY
            let tglLahirStr = '-';
            if (s.tanggalLahir) {
              const parts = s.tanggalLahir.split('-');
              if (parts.length === 3) tglLahirStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            // Gunakan inisial jika API avatar gagal
            const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(s.nama)}&background=f1f5f9&color=0f766e&size=128&font-size=0.4`;
            const jk = s.jenisKelamin === 'L' ? 'Laki-laki' : 'Perempuan';

            return `
              <div class="card-portrait" data-santri="${s.id}">
                
                <!-- HEADER -->
                <div class="card-header">
                  <div class="card-brand">
                    <img src="https://lh3.googleusercontent.com/d/1F6GqnKh5sEGXFMIeFob5a3jib1CbhpHv" onerror="this.src='https://ui-avatars.com/api/?name=TPA&background=0f766e&color=fff&size=128'">
                    <div class="brand-text">
                      <h3>TPA AR-RAHMAN</h3>
                      <p>KARTU ANGGOTA</p>
                    </div>
                  </div>
                  <div class="header-right">
                    <div class="badge-aktif">AKTIF</div>
                    <div class="header-nis">${s.nis}</div>
                  </div>
                </div>

                <!-- KOTAK PROFIL -->
                <div class="profile-box">
                  <div class="profile-top">
                    <div class="foto-wrap">
                      <img src="${fallbackImg}" class="foto-img" alt="Foto">
                      <div class="badge-santri">SANTRI</div>
                    </div>
                    <div class="profile-info">
                      <div class="info-nama">${tpa.esc(s.nama)}</div>
                      <div class="tags">
                        <span class="tag">${s.nis}</span>
                        <span class="tag">Kelas ${kelas}</span>
                      </div>
                    </div>
                  </div>

                  <div class="details-grid">
                    <div class="detail-item">
                      <span class="label">TGL LAHIR</span>
                      <span class="value">${tglLahirStr}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">KELAMIN</span>
                      <span class="value">${jk}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">WALI SANTRI</span>
                      <span class="value" title="${s.namaWali || '-'}">${tpa.esc(s.namaWali || '-')}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">GOL DARAH</span>
                      <span class="value">${s.golDarah && s.golDarah !== '-' ? s.golDarah : '-'}</span>
                    </div>
                    <div class="detail-item full">
                      <span class="label">ALAMAT</span>
                      <span class="value" title="${s.alamat || 'Jogonalan Lor'}">${tpa.esc(s.alamat || 'Jogonalan Lor')}</span>
                    </div>
                  </div>

                  <div class="validity-box">
                    <div class="label">📅 MASA BERLAKU</div>
                    <div class="value">${tglBerlaku}</div>
                  </div>
                </div>

                <!-- KOTAK QR CODE -->
                <div class="qr-box">
                  <div class="qr-container">
                    <div id="qr-${s.id}"></div>
                  </div>
                  <div class="btn-scan">
                    <span>◎</span> SCAN PRESENSI HADIR TPQ
                  </div>
                  <p class="qr-hint">Arahkan kamera scanner di menu Presensi untuk kehadiran...</p>
                </div>

              </div>
            `;
          }).join('') || '<div class="empty">Tidak ada santri aktif.</div>'}
        </div>
      </div>
    `;

    tpa.mountPage('Kartu Anggota', html);

    // Render QR Code
    requestAnimationFrame(() => {
      santriList.forEach(s => {
        const qrEl = document.getElementById(`qr-${s.id}`);
        if (qrEl && qrEl.childElementCount === 0) {
          new QRCode(qrEl, {
            text: s.nis,
            width: 150, // QR Code besar
            height: 150, 
            colorDark: '#0f766e', // Warna QR disesuaikan dengan tema tosca
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H // High correction for better scan
          });
        }
      });
    });
  }

  render();
  tpa.onDataChange(render);
</script>
</body>
</html>
