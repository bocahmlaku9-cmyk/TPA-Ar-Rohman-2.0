<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Anggota · TPA Ar Rahman</title>
<link rel="stylesheet" href="shared.css">
<!-- Library QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  /* =========================================
     STYLE KARTU ANGGOTA (UKURAN FISIK 5.4 x 8.5 CM)
     ========================================= */
  
  :root {
    --teal-primary: #0f766e;
    --bg-dark-green: #0b5e3b;
    --gold-accent: #eab308;
    --text-dark: #1a202c;
    --text-grey: #718096;
  }

  .kartu-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 16px;
    justify-content: center;
  }

  /* UKURAN KARTU PRESISI (Lebar 5.4cm, Tinggi 8.5cm) */
  .card-portrait {
    background-color: var(--bg-dark-green);
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><path fill="white" d="M50 0C22.4 0 0 22.4 0 50s22.4 50 50 50 50-22.4 50-50S77.6 0 50 0zm0 90C27.9 90 10 72.1 10 50S27.9 10 50 10s40 17.9 40 40-17.9 40-40 40zM30 30h40v10H30zm0 20h40v10H30zm0 20h40v10H30z"/></svg>');
    background-size: 150%;
    background-position: center;
    
    border: 1.5mm solid var(--gold-accent); /* Border emas diperkecil */
    border-radius: 3mm;
    width: 5.4cm;
    height: 8.5cm;
    padding: 2.5mm;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }

  /* --- HEADER --- */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2mm;
    flex-shrink: 0;
  }
  .card-brand {
    display: flex;
    align-items: center;
    gap: 1.5mm;
  }
  .card-brand img {
    width: 7mm;
    height: 7mm;
    border-radius: 1mm;
    object-fit: contain;
    background: #fff;
    padding: 0.5mm;
  }
  .brand-text h3 {
    font-size: 3mm; /* Font disesuaikan */
    font-weight: 900;
    color: #ffffff;
    margin: 0;
    line-height: 1.1;
  }
  .brand-text p {
    font-size: 2.2mm;
    font-weight: 700;
    color: #a7f3d0;
    margin: 0;
  }
  
  .header-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1mm;
  }
  .badge-aktif {
    background: var(--gold-accent);
    color: #000;
    font-size: 2mm;
    font-weight: 800;
    padding: 0.5mm 2mm;
    border-radius: 3mm;
  }
  .header-nis {
    font-size: 2mm;
    font-weight: 700;
    color: var(--gold-accent);
    font-family: monospace;
  }

  /* --- KOTAK PROFIL (ATAS - PUTIH) --- */
  .profile-box {
    background: #ffffff;
    border-radius: 2mm;
    padding: 2mm;
    margin-bottom: 2mm;
    flex-shrink: 0;
    color: var(--text-dark);
  }

  .profile-top {
    display: flex;
    gap: 2mm;
    margin-bottom: 2mm;
  }

  .foto-wrap {
    width: 13mm;
    height: 17mm;
    border-radius: 1.5mm;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    background: #f1f5f9;
  }
  .foto-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .badge-santri {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(15,118,110,0.95), rgba(15,118,110,0.6), transparent);
    color: #fff;
    font-size: 1.6mm;
    font-weight: 800;
    text-align: center;
    padding: 2mm 0 0.5mm 0;
  }

  .profile-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 1mm;
  }
  .info-nama {
    font-size: 3.2mm; /* Nama tetap paling besar */
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 1.5mm;
    color: var(--text-dark);
    word-wrap: break-word;
  }
  .tags {
    display: flex;
    gap: 1mm;
    flex-wrap: wrap;
  }
  .tag {
    background: #ccfbf1;
    color: var(--teal-primary);
    font-size: 2mm;
    font-weight: 800;
    padding: 0.5mm 1.5mm;
    border-radius: 1mm;
  }

  /* Grid Data Diri */
  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5mm 1mm;
  }
  .detail-item {
    display: flex;
    flex-direction: column;
  }
  .detail-item.full {
    grid-column: 1 / -1;
  }
  .detail-item .label {
    font-size: 1.6mm;
    font-weight: 800;
    color: var(--text-grey);
    margin-bottom: 0.2mm;
  }
  .detail-item .value {
    font-size: 2.2mm;
    font-weight: 800;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Kotak Masa Berlaku */
  .validity-box {
    background: #f0fdfa;
    border: 0.3mm solid #99f6e4;
    border-radius: 1mm;
    padding: 1mm 1.5mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2mm;
  }
  .validity-box .label {
    font-size: 1.8mm;
    font-weight: 800;
    color: var(--teal-primary);
  }
  .validity-box .value {
    font-size: 2mm;
    font-weight: 900;
    color: var(--teal-primary);
  }

  /* --- KOTAK QR CODE (BAWAH - PUTIH) --- */
  .qr-box {
    background: #ffffff;
    border-radius: 2mm;
    padding: 2mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1; /* Mengisi sisa ruang di bawah */
    justify-content: center;
    color: var(--text-dark);
  }

  .qr-container {
    background: #fff;
    padding: 0.5mm;
    border-radius: 1mm;
    margin-bottom: 2mm;
  }
  .qr-container canvas, .qr-container img {
    width: 24mm !important; /* Ukuran QR proporsional dengan KTA */
    height: 24mm !important;
    display: block;
  }

  .btn-scan {
    background: var(--teal-primary);
    color: #fff;
    font-size: 2.2mm;
    font-weight: 800;
    padding: 1.5mm;
    border-radius: 3mm;
    text-align: center;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1mm;
    margin-bottom: 1mm;
  }

  .qr-hint {
    font-size: 1.6mm;
    color: var(--text-grey);
    text-align: center;
    line-height: 1.2;
    margin: 0;
    font-weight: 500;
  }

  /* --- PENGATURAN CETAK (PRINT) --- */
  @media print {
    /* Mengatur ukuran kertas A4 dengan margin 1cm */
    @page { size: A4; margin: 10mm; }
    body { background: #fff; }
    .sidebar, .topbar, .bottom-nav, .btn-print, .card-title, .muted { display: none !important; }
    .layout, .main, .page { display: block !important; padding: 0 !important; margin: 0 !important; }
    
    /* Mengatur grid untuk mencetak banyak kartu dalam 1 lembar A4 */
    .kartu-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 5.4cm); /* 3 kolom */
      gap: 5mm; 
      justify-content: start;
    }
    .card-portrait { 
      break-inside: avoid; 
      box-shadow: none; 
      -webkit-print-color-adjust: exact; 
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
  const sess = tpa.requireAuth();

  function render() {
    const d = tpa.loadData();
    let santriList = d.santri.filter(s => s.status === 'Aktif');
    
    if (sess.role === 'walisantri') {
      santriList = santriList.filter(s => sess.santriIds.includes(s.id));
    }

    const nextYear = new Date();
    nextYear.setFullYear(nextYear.getFullYear() + 1);
    const tglBerlaku = nextYear.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

    const html = `
      <div class="card">
        <div class="card-title">
          <span>Kartu Santri (Ukuran 5.4 x 8.5 cm)</span>
          <button class="btn btn-primary btn-print" onclick="window.print()">🖨 Cetak Kartu (A4)</button>
        </div>
        <p class="muted">Pastikan opsi "Background graphics" dicentang dan skala cetak 100% saat mencetak.</p>
        
        <div class="kartu-grid">
          ${santriList.map(s => {
            const kelas = d.kelas.find(x => x.id === s.kelasId)?.kode || '-';
            
            let tglLahirStr = '-';
            if (s.tanggalLahir) {
              const parts = s.tanggalLahir.split('-');
              if (parts.length === 3) tglLahirStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(s.nama)}&background=f1f5f9&color=0f766e&size=128&font-size=0.4`;
            const jk = s.jenisKelamin === 'L' ? 'Laki-laki' : 'Perempuan';
            const nisDisplay = s.nis || '-';

            return `
              <div class="card-portrait" data-santri="${s.id}">
                
                <!-- HEADER -->
                <div class="card-header">
                  <div class="card-brand">
                    <img src="https://lh3.googleusercontent.com/d/1F6GqnKh5sEGXFMIeFob5a3jib1CbhpHv" onerror="this.src='https://ui-avatars.com/api/?name=TPA&background=0f766e&color=fff&size=128'">
                    <div class="brand-text">
                      <h3>TPA AR-RAHMAN</h3>
                      <p>KARTU ANGGOTA</p>
                    </div>
                  </div>
                  <div class="header-right">
                    <div class="badge-aktif">AKTIF</div>
                    <div class="header-nis">${nisDisplay}</div>
                  </div>
                </div>

                <!-- KOTAK PROFIL -->
                <div class="profile-box">
                  <div class="profile-top">
                    <div class="foto-wrap">
                      <img src="${fallbackImg}" class="foto-img" alt="Foto">
                      <div class="badge-santri">SANTRI</div>
                    </div>
                    <div class="profile-info">
                      <div class="info-nama">${tpa.esc(s.nama)}</div>
                      <div class="tags">
                        <span class="tag">${nisDisplay}</span>
                        <span class="tag">Kelas ${kelas}</span>
                      </div>
                    </div>
                  </div>

                  <div class="details-grid">
                    <div class="detail-item">
                      <span class="label">TGL LAHIR</span>
                      <span class="value">${tglLahirStr}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">KELAMIN</span>
                      <span class="value">${jk}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">WALI SANTRI</span>
                      <span class="value" title="${s.namaWali || '-'}">${tpa.esc(s.namaWali || '-')}</span>
                    </div>
                    <div class="detail-item">
                      <span class="label">GOL DARAH</span>
                      <span class="value">${s.golDarah && s.golDarah !== '-' ? s.golDarah : '-'}</span>
                    </div>
                    <div class="detail-item full">
                      <span class="label">ALAMAT</span>
                      <span class="value" title="${s.alamat || 'Jogonalan Lor'}">${tpa.esc(s.alamat || 'Jogonalan Lor')}</span>
                    </div>
                  </div>

                  <div class="validity-box">
                    <div class="label">📅 MASA BERLAKU</div>
                    <div class="value">${tglBerlaku}</div>
                  </div>
                </div>

                <!-- KOTAK QR CODE -->
                <div class="qr-box">
                  <div class="qr-container">
                    <div id="qr-${s.id}"></div>
                  </div>
                  <div class="btn-scan">
                    <span>◉</span> SCAN PRESENSI
                  </div>
                  <p class="qr-hint">Arahkan kamera scanner di menu Presensi...</p>
                </div>

              </div>
            `;
          }).join('') || '<div class="empty">Tidak ada santri aktif.</div>'}
        </div>
      </div>
    `;

    tpa.mountPage('Kartu Anggota', html);

    // Render QR Code
    requestAnimationFrame(() => {
      santriList.forEach(s => {
        const qrEl = document.getElementById(`qr-${s.id}`);
        if (qrEl && qrEl.childElementCount === 0) {
          new QRCode(qrEl, {
            text: s.nis || 'TIDAK-ADA-NIS',
            width: 120, // Resolusi tinggi agar tetap tajam saat dicetak
            height: 120, 
            colorDark: '#0f766e', 
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H 
          });
        }
      });
    });
  }

  render();
  tpa.onDataChange(render);
</script>
</body>
</html>
